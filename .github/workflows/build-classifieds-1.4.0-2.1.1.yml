name: Build Classifieds 1.4.0 package for Geeklog 2.1.1

on:
  push:
    branches:
      - classifieds_1.4.0
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classifieds-1.4.0-2.1.1-dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dist:
    runs-on: ubuntu-latest

    env:
      ARCHIVE_NAME: classifieds_1.4.0_2.1.1.zip

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 5.6
        uses: shivammathur/setup-php@v2
        with:
          php-version: '5.6'
          coverage: none
          tools: none

      - name: Validate Memorandum source contract
        shell: bash
        run: |
          set -euo pipefail

          echo "Linting shipped PHP and INC files with PHP 5.6..."
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(
            find . -type f \( -name '*.php' -o -name '*.inc' \) \
              -not -path './dist/*' -print0
          )

          echo "Checking for legacy full-page rendering..."
          if grep -R -nE 'COM_site(Header|Footer)[[:space:]]*\(' \
              --include='*.php' --include='*.inc' --exclude-dir=dist .; then
            echo "Legacy COM_siteHeader()/COM_siteFooter() rendering is forbidden by the Memorandum."
            exit 1
          fi

          echo "Validating plugin.json..."
          php -r '
            $m = json_decode(file_get_contents("plugin.json"), true);
            if (!is_array($m)
                || !isset($m["schema"]) || (int) $m["schema"] !== 1
                || !isset($m["id"]) || $m["id"] !== "classifieds"
                || !isset($m["name"]) || $m["name"] !== "Classifieds"
                || !isset($m["requires"]["geeklog"]) || $m["requires"]["geeklog"] !== "2.1.1"
                || !isset($m["requires"]["php"]) || $m["requires"]["php"] !== "5.6.0") {
                fwrite(STDERR, "Invalid or inconsistent plugin.json\n");
                exit(1);
            }
          '

          echo "Checking language-key parity..."
          php -r '
            function classifieds_language_contract($path) {
                $LANG_CLASSIFIEDS_1 = array();
                $LANG_CLASSIFIEDS_2 = array();
                $LANG_CLASSIFIEDS_ADMIN = array();
                $LANG_CLASSIFIEDS_EMAIL = array();
                $LANG_confignames = array();
                $LANG_configtooltips = array();
                $LANG_configselects = array();
                include $path;

                return array(
                    "public" => array_keys($LANG_CLASSIFIEDS_1),
                    "forms" => array_keys($LANG_CLASSIFIEDS_2),
                    "admin" => array_keys($LANG_CLASSIFIEDS_ADMIN),
                    "email" => array_keys($LANG_CLASSIFIEDS_EMAIL),
                    "config" => isset($LANG_confignames["classifieds"])
                        ? array_keys($LANG_confignames["classifieds"]) : array(),
                    "tooltips" => isset($LANG_configtooltips["classifieds"])
                        ? array_keys($LANG_configtooltips["classifieds"]) : array(),
                    "select_ids" => isset($LANG_configselects["classifieds"])
                        ? array_keys($LANG_configselects["classifieds"]) : array()
                );
            }

            $en = classifieds_language_contract("language/english.php");
            $fr = classifieds_language_contract("language/french_france_utf-8.php");

            foreach ($en as $section => $keys) {
                sort($keys);
                $other = $fr[$section];
                sort($other);
                if ($keys !== $other) {
                    fwrite(STDERR, "Language key parity failure in " . $section . "\n");
                    fwrite(STDERR, "English: " . implode(", ", $keys) . "\n");
                    fwrite(STDERR, "French: " . implode(", ", $other) . "\n");
                    exit(1);
                }
            }
          '

          echo "Checking duplicate Plugin API callbacks..."
          python3 - <<'PY'
          from __future__ import print_function
          from collections import Counter
          from pathlib import Path
          import re
          import sys

          callbacks = Counter()
          locations = {}
          pattern = re.compile(r"function\s+(plugin_[A-Za-z0-9_]+_classifieds)\s*\(")
          for path in Path(".").rglob("*"):
              if not path.is_file() or path.suffix not in (".php", ".inc"):
                  continue
              if "dist" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              for name in pattern.findall(text):
                  callbacks[name] += 1
                  locations.setdefault(name, []).append(str(path))

          duplicates = {name: locations[name] for name, count in callbacks.items() if count > 1}
          if duplicates:
              print("Duplicate Classifieds Plugin API callbacks detected:")
              for name, paths in sorted(duplicates.items()):
                  print("  {}: {}".format(name, ", ".join(paths)))
              sys.exit(1)
          PY

      - name: Build installable plugin archive
        shell: bash
        run: |
          set -euo pipefail

          STAGE="${RUNNER_TEMP}/classifieds-package"
          PLUGIN_STAGE="${STAGE}/classifieds"
          rm -rf "${STAGE}"
          mkdir -p "${PLUGIN_STAGE}" dist

          # Geeklog 2.1.1 determines the plugin name from the archive's first
          # top-level directory. Therefore every shipped file must live under
          # classifieds/ inside the ZIP, never directly at the archive root.
          #
          # Copy only plugin payload files. Hidden files/directories and dist/
          # are deliberately excluded from the installable package.
          rsync -a \
            --exclude='.*' \
            --exclude='*/.*' \
            --exclude='dist/' \
            ./ "${PLUGIN_STAGE}/"

          # Fail loudly if a hidden entry somehow reaches the staging tree.
          if find "${PLUGIN_STAGE}" -mindepth 1 -name '.*' -print -quit | grep -q .; then
            echo "A hidden file or directory was found in the package staging tree."
            exit 1
          fi

          # Basic installable-package sanity checks before ZIP creation.
          for required in autoinstall.php functions.inc plugin.json public_html/index.php; do
            if [ ! -e "${PLUGIN_STAGE}/${required}" ]; then
              echo "Missing required plugin file: ${required}"
              exit 1
            fi
          done

          rm -f "dist/${ARCHIVE_NAME}"
          (
            cd "${STAGE}"
            zip -q -r "${GITHUB_WORKSPACE}/dist/${ARCHIVE_NAME}" classifieds
          )

          # Validate both ZIP integrity and the actual Geeklog package layout.
          unzip -t "dist/${ARCHIVE_NAME}"

          mapfile -t top_level_entries < <(
            unzip -Z1 "dist/${ARCHIVE_NAME}" |
              sed 's#^\./##' |
              cut -d/ -f1 |
              sed '/^$/d' |
              sort -u
          )

          if [ "${#top_level_entries[@]}" -ne 1 ] || [ "${top_level_entries[0]}" != "classifieds" ]; then
            echo "Invalid Geeklog package layout: archive must contain exactly one top-level directory named classifieds/."
            printf 'Found top-level entries: %s\n' "${top_level_entries[*]:-<none>}"
            exit 1
          fi

          for required in \
            classifieds/autoinstall.php \
            classifieds/functions.inc \
            classifieds/plugin.json \
            classifieds/public_html/index.php
          do
            if ! unzip -Z1 "dist/${ARCHIVE_NAME}" | grep -Fxq "${required}"; then
              echo "Missing required file in generated archive: ${required}"
              exit 1
            fi
          done

      - name: Commit generated archive to dist
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f "dist/${ARCHIVE_NAME}"

          if git diff --cached --quiet; then
            echo "Archive is unchanged."
            exit 0
          fi

          git commit -m "Build ${ARCHIVE_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload installable archive
        uses: actions/upload-artifact@v4
        with:
          name: classifieds_1.4.0_2.1.1
          path: dist/classifieds_1.4.0_2.1.1.zip
          if-no-files-found: error
          retention-days: 30
